services:
  - type: web
    name: laravel-vue-backend
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: Laravel
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_SUPPORTS_CREDENTIALS
        value: true
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: debug
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: laravel-vue-db
          property: connectionString
      - key: RUN_MIGRATIONS
        value: true

databases:
  - name: laravel-vue-db
    plan: free
    databaseName: laravel_vue
    user: laravel_vue
